<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>电商图片下载器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 16px; width: 380px;
      font-family: -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
      background: #fafafa;
      color: #1a1a1a;
    }
    h1 { font-size: 15px; margin: 0 0 12px; }
    .bar { display: flex; gap: 8px; margin-bottom: 12px; }
    button {
      flex: 1; padding: 8px 12px; border: 0; border-radius: 6px;
      background: #4f46e5; color: #fff; font-size: 13px; cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #4338ca; }
    button.secondary { background: #e5e7eb; color: #1f2937; }
    button.secondary:hover { background: #d1d5db; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status { font-size: 12px; color: #6b7280; margin-bottom: 8px; min-height: 16px; }
    .thumb-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      max-height: 340px; overflow-y: auto; padding: 4px;
      border: 1px solid #e5e7eb; border-radius: 8px; background: #fff;
    }
    .thumb {
      position: relative; aspect-ratio: 1; background: #f3f4f6;
      border-radius: 4px; overflow: hidden; cursor: pointer;
      border: 2px solid transparent;
    }
    .thumb.selected { border-color: #4f46e5; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb .chk {
      position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
      border-radius: 3px; background: #4f46e5; color: #fff; font-size: 10px;
      display: none; align-items: center; justify-content: center;
    }
    .thumb.selected .chk { display: flex; }
    .empty { grid-column: 1 / -1; text-align: center; color: #9ca3af; padding: 24px 0; font-size: 13px; }
    .footer { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
    .count { font-size: 12px; color: #6b7280; flex: 1; }
  </style>
</head>
<body>
  <h1>🛒 电商图片下载器</h1>
  <div class="bar">
    <button id="scanBtn">🔍 扫描本页图片</button>
    <button id="selectAllBtn" class="secondary" disabled>全选</button>
  </div>
  <div class="status" id="status">点击扫描开始收集图片...</div>
  <div class="thumb-grid" id="grid">
    <div class="empty">尚未扫描</div>
  </div>
  <div class="footer">
    <span class="count" id="count">已选 0 / 共 0 张</span>
    <button id="downloadZipBtn" disabled>📦 打包 ZIP</button>
  </div>
  <script src="jszip.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
